name: autograde
on: [push, pull_request]
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm ci --prefix tests
      - name: Run content checks (1-6)
        run: ./run_tests.sh
      # Checks 7 (git history) and 8 (merged PR) are verified by the
      # instructor from the fork history at grading time.
